  <!-- Auto-recovery on chunk mismatch after new deployment -->
  <script>
    window.addEventListener('error', function(event) {
      var err = event && (event.message || event.error);
      var text = (typeof err === 'string' ? err : (err && err.message) ? err.message : '') + (event.filename || '');
      if (/Failed to fetch dynamically imported module|Loading chunk|chunk-.*\.js|mime type/i.test(text)) {
        var last = parseInt(sessionStorage.getItem('cf_auto_reload') || '0', 10);
        if (Date.now() - last > 6000) {
          sessionStorage.setItem('cf_auto_reload', Date.now().toString());
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.update(); });
              window.location.reload();
            }).catch(function() {
              window.location.reload();
            });
          } else {
            window.location.reload();
          }
        }
      }
    }, true);
  </script>
