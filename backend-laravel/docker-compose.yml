services:
  # ---------------------------------------------------------------------------
  # 1. API Backend Laravel 13 (Nginx + PHP 8.3-FPM)
  # Port hôte isolé : 8095 (évite tout conflit avec les autres projets du VPS)
  # Accessible sur http://180.149.199.233:8095/api/v1
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: club_formateurs_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8095}:8000"
    env_file:
      - .env.docker
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://180.149.199.233:8095
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=club_des_formateurs
      - DB_USERNAME=club_user
      - DB_PASSWORD=${DB_PASSWORD:?definir DB_PASSWORD dans l'environnement}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?definir REDIS_PASSWORD}
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - club_network

  # ---------------------------------------------------------------------------
  # 2. Base de données MySQL 8.0 (Isolée dans club_network — aucun conflit port 3306)
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: club_formateurs_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: club_des_formateurs
      MYSQL_USER: club_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?definir DB_PASSWORD dans l'environnement}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?definir DB_ROOT_PASSWORD dans l'environnement}
    expose:
      - "3306"
    volumes:
      - club_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u club_user -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - club_network

  # ---------------------------------------------------------------------------
  # 3. phpMyAdmin (Port hôte isolé : 8096)
  # Accessible sur http://180.149.199.233:8096
  # ---------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: club_formateurs_pma
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PMA_PORT:-8096}:80"
    profiles: ["tools"]
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 150M
    depends_on:
      - db
    networks:
      - club_network

  # ---------------------------------------------------------------------------
  # 4. Redis 7 (Isolé dans club_network — aucun conflit port 6379 sur le VPS)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?definir REDIS_PASSWORD}"]
    container_name: club_formateurs_redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - club_redis_data:/data
    networks:
      - club_network

networks:
  club_network:
    name: club_formateurs_net
    driver: bridge

volumes:
  club_db_data:
    name: club_formateurs_db_data
  club_redis_data:
    name: club_formateurs_redis_data
