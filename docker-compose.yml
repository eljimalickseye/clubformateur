services:
  # ---------------------------------------------------------------------------
  # 1. API Backend Laravel 13 (Nginx + PHP 8.3-FPM)
  # Accessible sur http://localhost:8000/api/v1
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: club_formateurs_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=club_des_formateurs
      - DB_USERNAME=club_user
      - DB_PASSWORD=club_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - club_network

  # ---------------------------------------------------------------------------
  # 2. Base de données MySQL 8.0
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: club_formateurs_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: club_des_formateurs
      MYSQL_USER: club_user
      MYSQL_PASSWORD: club_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - club_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "club_user", "-pclub_password"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - club_network

  # ---------------------------------------------------------------------------
  # 3. phpMyAdmin (Interface visuelle pour explorer les 14 tables)
  # Accessible sur http://localhost:8080
  # ---------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: club_formateurs_pma
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: club_user
      PMA_PASSWORD: club_password
      UPLOAD_LIMIT: 150M
    depends_on:
      - db
    networks:
      - club_network

  # ---------------------------------------------------------------------------
  # 4. Redis 7 (Cache, Sessions & Queues temps réel)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: club_formateurs_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - club_redis_data:/data
    networks:
      - club_network

networks:
  club_network:
    driver: bridge

volumes:
  club_db_data:
  club_redis_data:
